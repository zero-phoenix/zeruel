services:
  - type: web
    name: zeruel-synthetic-probe
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: ZERUEL_ACCESS_TOKEN
        generateValue: true
      - key: ZERUEL_AGY_OAUTH_TOKEN
        sync: false
      - key: ZERUEL_GEMINI_FREE_KEY
        sync: false
      - key: ZERUEL_CHECKPOINT_DEPLOYMENT_ID
        sync: false
      - key: ZERUEL_CHECKPOINT_SECRET
        sync: false
      - key: ZERUEL_CHECKPOINT_OAUTH_JSON
        sync: false
